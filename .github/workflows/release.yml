name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, must equal version= in module.prop (for example v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches module.prop
        run: |
          prop_version=$(grep -m1 '^version=' module.prop | cut -d= -f2-)
          if [ "$prop_version" != "$TAG" ]; then
            echo "Tag $TAG does not match module.prop version $prop_version"
            exit 1
          fi

      - name: Build ZIP and checksum
        run: |
          zip -r -X "ucanlog-$TAG.zip" module.prop customize.sh action.sh system META-INF
          sha256sum "ucanlog-$TAG.zip" > "ucanlog-$TAG.zip.sha256"
          cat "ucanlog-$TAG.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "ucanlog-$TAG.zip" "ucanlog-$TAG.zip.sha256" --clobber
          else
            gh release create "$TAG" "ucanlog-$TAG.zip" "ucanlog-$TAG.zip.sha256" \
              --title "UcanLog $TAG" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA"
          fi
